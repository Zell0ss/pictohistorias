# TAILSCALE_IP se sustituye por la IP Tailscale del servidor al hacer `make deploy`.
server {
    listen TAILSCALE_IP:5252;
    listen 127.0.0.1:5252;
    server_name _;

    client_max_body_size 15m;

    root /data/pictohistorias/frontend;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /pictos/ {
        alias /data/pictohistorias/cache/pictos/;
    }

    location /fotos/ {
        alias /data/pictohistorias/fotos/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
